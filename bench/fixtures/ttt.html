<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe</title>
<style>
:root {
  --primary: #6c5ce7;
  --accent: #00cec9;
  --pink: #fd79a8;
  --dark: #2d3436;
  --light: #dfe6e9;
}
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #6c5ce7, #00cec9);
  font-family: system-ui, sans-serif;
  color: #2d3436;
}
.card {
  background: #dfe6e9;
  padding: 2rem;
  border-radius: 16px;
  text-align: center;
}
h1 {
  margin: 0 0 1rem;
  color: #6c5ce7;
}
.board {
  display: grid;
  grid-template-columns: repeat(3, 90px);
  gap: 8px;
}
.cell {
  width: 90px;
  height: 90px;
  font-size: 2.5rem;
  border: none;
  border-radius: 12px;
  background: #ffffff;
}
.cell.x { color: #fd79a8; }
.cell.o { color: #00cec9; }
button.restart {
  background: #6c5ce7;
  color: #ffffff;
}
</style>
</head>
<body>
<div class="card">
  <h1>Tic Tac Toe</h1>
  <div class="board" id="board"></div>
  <button class="restart" id="restart">Restart</button>
</div>
<script>
const board = document.getElementById('board')
const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]
let cells = Array(9).fill('')
let turn = 'X'
function winner() {
  for (const [a, b, c] of lines) if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) return cells[a]
  return cells.every(Boolean) ? 'draw' : null
}
function render() {
  board.innerHTML = ''
  cells.forEach((v, i) => {
    const b = document.createElement('button')
    b.className = 'cell ' + v.toLowerCase()
    b.textContent = v
    b.onclick = () => { if (!cells[i] && !winner()) { cells[i] = turn; turn = turn === 'X' ? 'O' : 'X'; render() } }
    board.appendChild(b)
  })
}
document.getElementById('restart').onclick = () => { cells = Array(9).fill(''); turn = 'X'; render() }
render()
</script>
</body>
</html>
